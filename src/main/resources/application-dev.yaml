logging:
  level:
    org.springframework.security: DEBUG

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
