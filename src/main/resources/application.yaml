spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: petlog

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:petlog}
    username: ${DB_USER:petlog}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
